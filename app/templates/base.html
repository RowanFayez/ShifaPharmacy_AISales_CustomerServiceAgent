<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shifa Pharmacy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">Shifa Pharmacy Admin</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('admin.category_list') }}">Categories</a>
          <a class="nav-link" href="{{ url_for('admin.product_list') }}">Products</a>
          <a class="nav-link" href="{{ url_for('admin.order_list') }}">Orders</a>
          <a class="nav-link" href="{{ url_for('admin.customer_list') }}">Customers</a>
          <a class="nav-link" href="{{ url_for('admin.knowledge_list') }}">Knowledge base</a>
          <a class="nav-link" href="{{ url_for('admin.conversation_list') }}">Conversations</a>
          <a class="nav-link" href="{{ url_for('admin.lead_list') }}">Leads</a>
          <a class="nav-link" href="{{ url_for('admin.handoff_list') }}">Handoffs</a>
        </div>
      </div>
    </nav>
    <main class="container pb-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
